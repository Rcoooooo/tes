<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Poppins,Arial,sans-serif;
    color:#fff;
    background:radial-gradient(circle at top,#35105a 0%,#160820 45%,#07070c 100%);
    min-height:100vh;
    padding:28px 16px;
}
.container{max-width:1150px;margin:auto}
header{text-align:center;margin-bottom:25px}
header h1{margin:0;color:#f5d0fe;font-size:clamp(28px,5vw,48px)}
header p{margin:6px 0;color:#cbb9d5}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.card{
    background:rgba(18,10,29,.88);
    border:1px solid rgba(192,132,252,.2);
    border-radius:18px;
    padding:20px;
    box-shadow:0 15px 45px rgba(0,0,0,.3);
}
.card h2{margin:0 0 16px;font-size:20px;color:#e9c8ff}
label{display:block;font-size:13px;color:#cbb9d5;margin-bottom:6px}
input,select{
    width:100%;border:1px solid #43205c;background:#110b18;color:#fff;
    padding:12px 13px;border-radius:10px;outline:none;font-family:inherit
}
input:focus,select:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.12)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:12px}
.item-row{display:grid;grid-template-columns:1.5fr .55fr auto;gap:9px;align-items:end}
button{
    border:0;border-radius:10px;padding:11px 15px;font-family:inherit;
    font-weight:600;cursor:pointer;transition:.18s
}
.btn-primary{background:linear-gradient(135deg,#a855f7,#7e22ce);color:#fff}
.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn-secondary{background:#261431;color:#e9c8ff;border:1px solid #4a2461}
.btn-danger{background:#451522;color:#ffb8c5}
button:disabled{opacity:.5;cursor:not-allowed}
.items{margin-top:16px}
.empty{text-align:center;padding:22px;color:#8f7c99;border:1px dashed #392445;border-radius:12px}
.line{
    display:flex;justify-content:space-between;gap:12px;align-items:center;
    background:#110b18;border:1px solid #2c1939;border-radius:11px;padding:12px;margin-bottom:8px
}
.line-info strong{display:block;font-size:14px}
.line-info span{font-size:12px;color:#9e8ca7}
.line-total{font-weight:700;color:#d8a8ff;white-space:nowrap}
.total-box{
    margin-top:16px;padding:17px;border-radius:13px;
    background:linear-gradient(135deg,rgba(126,34,206,.25),rgba(168,85,247,.08));
    border:1px solid rgba(168,85,247,.3)
}
.total-line{display:flex;justify-content:space-between;align-items:center}
.total-value{font-size:25px;font-weight:700;color:#f0c8ff}
.actions{display:flex;gap:9px;margin-top:12px}
.actions button{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{padding:13px;border-radius:12px;background:#110b18;border:1px solid #2c1939}
.stat small{color:#9987a4;display:block;font-size:11px}
.stat b{font-size:18px;color:#e9c8ff}
.history{margin-top:18px}
.history-tools{display:flex;gap:8px;margin-bottom:12px}
.history-list{max-height:500px;overflow:auto;padding-right:2px}
.history-card{background:#110b18;border:1px solid #2c1939;border-radius:13px;padding:14px;margin-bottom:10px}
.history-top{display:flex;justify-content:space-between;gap:10px}
.history-name{font-weight:700}
.history-date{font-size:11px;color:#9b89a4}
.history-total{font-weight:700;color:#d8a8ff}
.history-meta{font-size:12px;color:#a998b2;margin:6px 0}
.history-items{font-size:12px;color:#cbb9d5;white-space:pre-line}
.history-actions{display:flex;gap:7px;margin-top:10px}
.history-actions button{font-size:11px;padding:8px 10px}
.modal{
    position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:20
}
.modal.show{display:flex}
.modal-box{max-width:600px;width:100%;max-height:80vh;overflow:auto;background:#140b1d;border:1px solid #4b2660;border-radius:16px;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h3{margin:0;color:#edccff}
.close{background:#321b3e;color:#fff}
.item-table{width:100%;border-collapse:collapse}
.item-table th,.item-table td{text-align:left;padding:9px;border-bottom:1px solid #2d1a38;font-size:12px}
.item-table th{color:#c9a7d8}
.toast{
    position:fixed;right:18px;bottom:18px;background:#21122c;border:1px solid #61327d;
    padding:12px 16px;border-radius:10px;display:none;z-index:30
}
.toast.show{display:block}
@media(max-width:800px){
    .grid{grid-template-columns:1fr}
}
@media(max-width:520px){
    body{padding:18px 10px}
    .card{padding:15px}
    .form-grid{grid-template-columns:1fr}
    .item-row{grid-template-columns:1fr 80px}
    .item-row button{grid-column:1/-1}
    .stats{grid-template-columns:1fr}
    .actions{flex-direction:column}
}
</style>
</head>
<body>
<div class="container">
<header>
    <h1>Expense Calculator</h1>
    <p>Pencatatan pengeluaran & history transaksi</p>
</header>

<div class="grid">
<section class="card">
    <h2>🧮 Buat Pengeluaran</h2>

    <div class="form-grid">
        <div class="field">
            <label>Nama Pencatat</label>
            <input id="cashier" placeholder="Masukkan nama">
        </div>
        <div class="field">
            <label>Tanggal</label>
            <input id="date" type="date">
        </div>
    </div>

    <div class="field">
        <label>Nama Kelompok</label>
        <select id="group">
            <option value="">Pilih kelompok</option>
            <option value="GRMC">GRMC</option>
            <option value="ESG">ESG</option>
            <option value="BNB">BNB</option>
            <option value="WBP">WBP</option>
            <option value="BSF">BSF</option>
        </select>
    </div>

    <div class="field">
        <label>Keterangan</label>
        <input id="note" placeholder="Contoh: Restock barang">
    </div>

    <div class="item-row">
        <div>
            <label>Item</label>
            <select id="itemSelect"></select>
        </div>
        <div>
            <label>Jumlah</label>
            <input id="qty" type="number" min="1" value="1">
        </div>
        <button class="btn-primary" onclick="addItem()">+ Tambah</button>
    </div>

    <div class="items" id="cart"></div>

    <div class="total-box">
        <div class="total-line">
            <span>Total Pengeluaran</span>
            <span class="total-value" id="grandTotal">Rp 0</span>
        </div>
    </div>

    <div class="actions">
        <button class="btn-primary" onclick="saveTransaction()">💾 Simpan Pengeluaran</button>
        <button class="btn-secondary" onclick="clearCart()">↻ Reset</button>
    </div>
</section>

<section class="card">
    <h2>📊 Ringkasan</h2>
    <div class="stats">
        <div class="stat"><small>TRANSAKSI</small><b id="statTransactions">0</b></div>
        <div class="stat"><small>ITEM TERPAKAI</small><b id="statItems">0</b></div>
        <div class="stat"><small>TOTAL</small><b id="statTotal">Rp 0</b></div>
    </div>

    <div class="history">
        <h2>📜 History Pengeluaran</h2>
        <div class="history-tools">
            <input id="historySearch" placeholder="Cari nama / keterangan / item..." oninput="renderHistory()">
        </div>
        <div class="history-list" id="historyList"></div>
    </div>
</section>
</div>
</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <div class="modal-head">
            <h3>Detail Transaksi</h3>
            <button class="close" onclick="closeModal()">✕</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==========================================================
// DAFTAR ITEM & HARGA
// Ubah bagian ini jika ingin mengganti nama/harga item.
// ==========================================================
const ITEMS = [
    {name:"KECUBUNG", price:200000},
    {name:"MICIN", price:200000},
    {name:"VEST", price:200000},
    {name:"COMPACT RIfle", price:3000000},
    {name:"DOUBLE ACTION", price:1800000},
    {name:"7.62x39", price:1000000},
    {name:"GORILA", price:350000},
    {name:"OPIUM", price:350000},
    {name:"MOLOTOV", price:1000000}
];

const STORAGE_KEY = "expense_calculator_history_v1";

// ==========================================================
// DISCORD WEBHOOK
// Isi URL webhook Discord di bawah ini.
// ==========================================================
const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1556591010228867113/WrAt3qG2H6PSZ3vR4DPYs6aa9YgmUQzjOshHjayC8Ww4lrbTSgLm3AUTLVcswnh6O-OY";

let cart = [];

const rupiah = n => new Intl.NumberFormat("id-ID",{
    style:"currency",currency:"IDR",maximumFractionDigits:0
}).format(n);

function today(){
    const d = new Date();
    d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    return d.toISOString().slice(0,10);
}

function init(){
    document.getElementById("date").value = today();
    populateItems();
    renderCart();
    renderHistory();
}

function populateItems(){
    const select = document.getElementById("itemSelect");
    select.innerHTML = ITEMS.map((item,i)=>
        `<option value="${i}">${escapeHtml(item.name)} — ${rupiah(item.price)}</option>`
    ).join("");
}

function addItem(){
    const index = Number(document.getElementById("itemSelect").value);
    const qty = Math.max(1, Number(document.getElementById("qty").value) || 1);
    const item = ITEMS[index];
    if(!item) return;

    const existing = cart.find(x => x.name === item.name);
    if(existing) existing.qty += qty;
    else cart.push({name:item.name, price:item.price, qty});

    document.getElementById("qty").value = 1;
    renderCart();
}

function removeItem(index){
    cart.splice(index,1);
    renderCart();
}

function renderCart(){
    const box = document.getElementById("cart");
    if(!cart.length){
        box.innerHTML = `<div class="empty">Belum ada item. Pilih item lalu tekan <b>Tambah</b>.</div>`;
    }else{
        box.innerHTML = cart.map((x,i)=>`
            <div class="line">
                <div class="line-info">
                    <strong>${escapeHtml(x.name)}</strong>
                    <span>${x.qty} × ${rupiah(x.price)}</span>
                </div>
                <div class="line-total">${rupiah(x.qty*x.price)}</div>
                <button class="btn-danger" onclick="removeItem(${i})">Hapus</button>
            </div>
        `).join("");
    }
    document.getElementById("grandTotal").textContent = rupiah(cart.reduce((s,x)=>s+x.qty*x.price,0));
}

function clearCart(){
    cart=[];
    document.getElementById("note").value="";
    document.getElementById("qty").value=1;
    renderCart();
}

function getHistory(){
    try{return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []}
    catch(e){return []}
}

async function saveTransaction(){
    if(!cart.length){
        toast("Tambahkan minimal 1 item.");
        return;
    }

    const cashier = document.getElementById("cashier").value.trim() || "Tanpa Nama";
    const date = document.getElementById("date").value || today();
    const group = document.getElementById("group").value || "-";
    const note = document.getElementById("note").value.trim() || "-";
    const total = cart.reduce((s,x)=>s+x.qty*x.price,0);

    const transaction = {
        id: Date.now(),
        cashier,
        date,
        group,
        note,
        total,
        items: cart.map(x=>({...x}))
    };

    // Simpan ke history TERLEBIH DAHULU.
    const history = getHistory();
    history.unshift(transaction);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));

    // Kirim transaksi yang SAMA persis dengan data history ke Discord.
    if(DISCORD_WEBHOOK_URL && !DISCORD_WEBHOOK_URL.includes("MASUKKAN_WEBHOOK")){
        const sent = await sendToDiscord(transaction);

        if(sent){
            toast("Pengeluaran disimpan & berhasil dikirim ke Discord.");
        }else{
            toast("Pengeluaran tersimpan, tetapi gagal dikirim ke Discord.");
        }
    }else{
        toast("Pengeluaran berhasil disimpan.");
    }

    clearCart();
    renderHistory();
}

async function sendToDiscord(t){
    const itemsText = t.items.map(x =>
        `• **${x.name}** × ${x.qty} — ${rupiah(x.qty * x.price)}`
    ).join("\\n");

    const payload = {
        username: "Expense Calculator",
        embeds: [{
            title: "💸 PENGELUARAN BARU",
            description: "Transaksi baru telah dicatat dari Expense Calculator.",
            color: 11010048,
            fields: [
                { name: "👤 Nama Pencatat", value: t.cashier, inline: true },
                { name: "🏢 Kelompok", value: t.group, inline: true },
                { name: "📅 Tanggal", value: formatDate(t.date), inline: true },
                { name: "📝 Keterangan", value: t.note, inline: false },
                { name: "📦 Item", value: itemsText || "-", inline: false },
                { name: "💰 Total Pengeluaran", value: `**${rupiah(t.total)}**`, inline: false },
                { name: "🆔 ID Transaksi", value: String(t.id), inline: false }
            ],
            footer: {
                text: "Expense Calculator • History ID " + t.id
            },
            timestamp: new Date().toISOString()
        }]
    };

    try{
        const response = await fetch(DISCORD_WEBHOOK_URL, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(payload)
        });

        return response.ok;
    }catch(error){
        console.error("Discord webhook error:", error);
        return false;
    }
}

function renderHistory(){
    const list = document.getElementById("historyList");
    const search = document.getElementById("historySearch").value.toLowerCase().trim();
    const history = getHistory();

    const filtered = history.filter(t=>{
        const text = [
            t.cashier,t.group,t.note,t.date,
            ...t.items.map(x=>x.name)
        ].join(" ").toLowerCase();
        return text.includes(search);
    });

    if(!filtered.length){
        list.innerHTML = `<div class="empty">Belum ada history pengeluaran.</div>`;
    }else{
        list.innerHTML = filtered.map(t=>`
            <div class="history-card">
                <div class="history-top">
                    <div>
                        <div class="history-name">${escapeHtml(t.cashier)}</div>
                        <div class="history-date">${formatDate(t.date)}</div>
                    </div>
                    <div class="history-total">${rupiah(t.total)}</div>
                </div>
                <div class="history-meta">Kelompok: ${escapeHtml(t.group || "-")} · Keterangan: ${escapeHtml(t.note)} · ${t.items.reduce((s,x)=>s+x.qty,0)} item</div>
                <div class="history-items">${t.items.map(x=>`${escapeHtml(x.name)} × ${x.qty} = ${rupiah(x.qty*x.price)}`).join("\n")}</div>
                <div class="history-actions">
                    <button class="btn-secondary" onclick="showDetail(${t.id})">Lihat Detail</button>
                    <button class="btn-danger" onclick="deleteTransaction(${t.id})">Hapus</button>
                </div>
            </div>
        `).join("");
    }

    const totalTransactions = history.length;
    const totalItems = history.reduce((s,t)=>s+t.items.reduce((a,x)=>a+x.qty,0),0);
    const totalMoney = history.reduce((s,t)=>s+t.total,0);

    document.getElementById("statTransactions").textContent = totalTransactions;
    document.getElementById("statItems").textContent = totalItems;
    document.getElementById("statTotal").textContent = rupiah(totalMoney);
}

function showDetail(id){
    const t = getHistory().find(x=>x.id===id);
    if(!t) return;

    document.getElementById("modalContent").innerHTML = `
        <p><b>Pencatat:</b> ${escapeHtml(t.cashier)}</p>
        <p><b>Tanggal:</b> ${formatDate(t.date)}</p>
        <p><b>Kelompok:</b> ${escapeHtml(t.group || "-")}</p>
        <p><b>Keterangan:</b> ${escapeHtml(t.note)}</p>
        <table class="item-table">
            <thead><tr><th>Item</th><th>Qty</th><th>Harga</th><th>Total</th></tr></thead>
            <tbody>
            ${t.items.map(x=>`
                <tr>
                    <td>${escapeHtml(x.name)}</td>
                    <td>${x.qty}</td>
                    <td>${rupiah(x.price)}</td>
                    <td>${rupiah(x.qty*x.price)}</td>
                </tr>
            `).join("")}
            </tbody>
        </table>
        <div class="total-box" style="margin-top:14px">
            <div class="total-line"><b>TOTAL</b><b>${rupiah(t.total)}</b></div>
        </div>
    `;
    document.getElementById("modal").classList.add("show");
}

function closeModal(){
    document.getElementById("modal").classList.remove("show");
}

function deleteTransaction(id){
    if(!confirm("Hapus transaksi ini dari history?")) return;
    const history = getHistory().filter(x=>x.id!==id);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(history));
    renderHistory();
    toast("Transaksi dihapus.");
}

function formatDate(date){
    if(!date) return "-";
    return new Intl.DateTimeFormat("id-ID",{
        day:"2-digit",month:"long",year:"numeric"
    }).format(new Date(date+"T00:00:00"));
}

function escapeHtml(value){
    return String(value).replace(/[&<>"']/g,m=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
}

let toastTimer;
function toast(message){
    const el=document.getElementById("toast");
    el.textContent=message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}

document.getElementById("modal").addEventListener("click",e=>{
    if(e.target.id==="modal") closeModal();
});

init();
</script>
</body>
</html>
